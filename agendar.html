<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agendar Horário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1C1A17; --paper:#FAF7F2; --card:#FFFFFF;
  --line:#E8E2D8; --line2:#DDD5C8;
  --accent:#9A5B3F; --accent-deep:#7A4530; --accent-soft:#F0E3D8;
  --ok:#3F7A5C; --ok-soft:#E3F0E9;
  --er:#B0463C; --er-soft:#FAE5E2;
  --muted:#8A8276;
  --r:18px; --rs:12px;
  --shadow:0 1px 2px rgba(28,26,23,.04), 0 8px 24px -8px rgba(28,26,23,.08);
  --shadow-lift:0 4px 10px rgba(28,26,23,.06), 0 16px 32px -12px rgba(28,26,23,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Plus Jakarta Sans',sans-serif;
  background:var(--paper);
  color:var(--ink);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
@media(prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }
.wrap{max-width:560px;margin:0 auto;padding:0 18px 60px;position:relative}

/* HEADER */
header{
  padding:40px 18px 26px;
  text-align:center;
  position:relative;
}
.salon-name{
  font-family:'Fraunces',serif;
  font-size:1.9rem; font-weight:600;
  letter-spacing:-.01em;
  margin-bottom:8px;
  opacity:0; animation:riseIn .6s ease-out .1s forwards;
}
.salon-underline{
  width:0; height:3px; background:var(--accent); border-radius:2px;
  margin:0 auto 10px; animation:drawIn .7s cubic-bezier(.65,0,.35,1) .5s forwards;
}
@keyframes drawIn{to{width:48px}}
.salon-sub{font-size:.82rem; color:var(--muted); opacity:0; animation:riseIn .6s ease-out .25s forwards}
.salon-meta{
  display:flex; align-items:center; justify-content:center; gap:14px;
  margin-top:12px; font-size:.72rem; color:var(--muted);
  opacity:0; animation:riseIn .6s ease-out .35s forwards;
}
.salon-meta a{color:var(--accent); text-decoration:none; font-weight:600}
.salon-meta span{display:inline-flex; align-items:center; gap:4px}
@keyframes riseIn{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:translateY(0)}}

/* GALERIA DE FOTOS DO SALÃO */
.galeria-scroll{
  display:flex; gap:8px; overflow-x:auto; padding:2px 2px 20px;
  scrollbar-width:none; opacity:0; animation:riseIn .6s ease-out .45s forwards;
}
.galeria-scroll::-webkit-scrollbar{display:none}
.galeria-foto{
  flex:0 0 auto; width:104px; height:104px; border-radius:var(--rs);
  object-fit:cover; border:1px solid var(--line); cursor:pointer;
}

/* STEPS INDICATOR */
.steps-ind{
  display:flex; align-items:center; justify-content:center;
  gap:6px; padding:0 18px 28px; max-width:560px; margin:0 auto;
}
.step-dot{
  width:8px; height:8px; border-radius:50%;
  background:var(--line2);
  transition:all .35s cubic-bezier(.65,0,.35,1);
}
.step-dot.on{background:var(--accent); width:22px; border-radius:4px}
.step-dot.done{background:var(--accent)}

/* CARD + TRANSIÇÃO ENTRE ETAPAS */
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--r);
  box-shadow:var(--shadow);
  overflow:hidden;
  position:relative;
}
#card-content{animation:stepIn .38s cubic-bezier(.2,.7,.3,1)}
@keyframes stepIn{
  from{opacity:0; transform:translateX(14px)}
  to{opacity:1; transform:translateX(0)}
}
#card-content.leaving{animation:stepOut .18s ease-in forwards}
@keyframes stepOut{
  from{opacity:1; transform:translateX(0)}
  to{opacity:0; transform:translateX(-10px)}
}
.card-hd{
  padding:24px 24px 4px;
}
.eyebrow{
  font-size:.68rem; font-weight:700; letter-spacing:.08em;
  text-transform:uppercase; color:var(--accent);
  margin-bottom:6px;
}
.card-title{
  font-family:'Fraunces',serif;
  font-size:1.35rem; font-weight:500;
}
.card-bd{padding:18px 24px 24px}

/* SERVICE LIST */
.svc-item{
  display:flex; align-items:center; gap:14px;
  padding:16px; border:1.5px solid var(--line);
  border-radius:var(--rs); margin-bottom:10px;
  cursor:pointer; transition:all .15s;
}
.svc-item:hover{border-color:var(--accent); background:var(--accent-soft); transform:translateY(-1px); box-shadow:var(--shadow-lift)}
.svc-item:active{transform:translateY(0) scale(.99)}
.svc-item.sel{border-color:var(--accent); background:var(--accent-soft)}
.svc-icon{
  width:38px; height:38px; border-radius:50%; flex-shrink:0;
  background:var(--accent-soft); color:var(--accent-deep);
  display:flex; align-items:center; justify-content:center; font-size:1.05rem;
}
.svc-info{flex:1; min-width:0}
.svc-name{font-weight:600; font-size:.92rem; margin-bottom:2px}
.svc-meta{font-size:.74rem; color:var(--muted)}
.svc-price{font-family:'Fraunces',serif; font-weight:600; font-size:1.05rem; color:var(--accent-deep); white-space:nowrap}

/* PROFISSIONAL GRID */
.pro-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.pro-item{
  display:flex; flex-direction:column; align-items:center; gap:10px;
  padding:20px 12px; border:1.5px solid var(--line);
  border-radius:var(--rs); cursor:pointer; transition:all .15s; text-align:center;
}
.pro-item:hover{border-color:var(--accent); transform:translateY(-2px); box-shadow:var(--shadow-lift)}
.pro-item:active{transform:translateY(0) scale(.99)}
.pro-item.sel{border-color:var(--accent); background:var(--accent-soft)}
.pro-av{
  width:52px; height:52px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-family:'Fraunces',serif; font-weight:600; font-size:1.15rem; color:#fff;
  box-shadow:0 0 0 3px var(--card), 0 0 0 4.5px var(--line2);
  position:relative;
}
.pro-item.sel .pro-av{box-shadow:0 0 0 3px var(--card), 0 0 0 4.5px var(--accent)}
.pro-name{font-weight:600; font-size:.84rem}
.pro-esp{font-size:.7rem; color:var(--muted)}

/* CALENDAR */
.date-scroll{
  display:flex; gap:8px; overflow-x:auto; padding:2px 2px 10px;
  scrollbar-width:none;
}
.date-scroll::-webkit-scrollbar{display:none}
.date-pill{
  flex:0 0 auto; display:flex; flex-direction:column; align-items:center;
  gap:2px; padding:12px 14px; border:1.5px solid var(--line);
  border-radius:var(--rs); cursor:pointer; min-width:56px; transition:all .15s;
}
.date-pill:hover{border-color:var(--accent)}
.date-pill.sel{border-color:var(--accent); background:var(--accent); color:#fff; box-shadow:var(--shadow-lift)}
.date-dow{font-size:.66rem; text-transform:uppercase; opacity:.7}
.date-day{font-family:'Fraunces',serif; font-weight:600; font-size:1.15rem}
.date-mon{font-size:.62rem; opacity:.7}

/* TIME SLOTS */
.time-grid{
  display:grid; grid-template-columns:repeat(4,1fr); gap:8px;
  margin-top:4px;
}
.time-slot{
  padding:11px 4px; border:1.5px solid var(--line);
  border-radius:10px; text-align:center; font-size:.82rem; font-weight:600;
  cursor:pointer; transition:all .15s;
}
.time-slot:hover{border-color:var(--accent)}
.time-slot.sel{border-color:var(--accent); background:var(--accent); color:#fff; box-shadow:var(--shadow-lift)}
.no-slots{
  text-align:center; padding:30px 12px; color:var(--muted); font-size:.85rem;
}

/* FORM */
.fld{margin-bottom:14px}
.fld label{
  display:block; font-size:.74rem; font-weight:700; color:var(--muted);
  text-transform:uppercase; letter-spacing:.03em; margin-bottom:6px;
}
.fld input{
  width:100%; padding:13px 14px; border:1.5px solid var(--line);
  border-radius:var(--rs); font-size:.92rem; font-family:inherit;
  background:var(--paper); transition:border-color .15s, box-shadow .15s;
}
.fld input:focus{outline:none; border-color:var(--accent); background:#fff; box-shadow:0 0 0 3px var(--accent-soft)}

/* SUMMARY */
.summary{
  background:var(--paper); border:1px solid var(--line);
  border-radius:var(--rs); padding:16px; margin-bottom:18px;
}
.sum-row{
  display:flex; justify-content:space-between; align-items:baseline;
  font-size:.84rem; padding:6px 0;
}
.sum-row + .sum-row{border-top:1px dashed var(--line2)}
.sum-label{color:var(--muted)}
.sum-val{font-weight:600}
.sum-total{font-family:'Fraunces',serif; font-size:1.3rem; color:var(--accent-deep)}

/* BUTTONS */
.btn{
  width:100%; padding:15px; border:none; border-radius:50px;
  font-family:inherit; font-size:.92rem; font-weight:700;
  cursor:pointer; transition:all .15s;
}
.btn-primary{background:var(--accent); color:#fff; box-shadow:0 2px 8px -2px rgba(154,91,63,.5)}
.btn-primary:hover{background:var(--accent-deep); transform:translateY(-1px); box-shadow:0 6px 16px -4px rgba(154,91,63,.55)}
.btn-primary:active{transform:translateY(0)}
.btn-primary:disabled{opacity:.4; cursor:not-allowed; transform:none; box-shadow:none}
.btn-ghost{background:transparent; color:var(--muted); margin-top:10px; font-weight:600}
.btn-ghost:hover{color:var(--ink)}
.btn-outline{background:#fff; color:var(--accent-deep); border:1.5px solid var(--line); margin-top:10px}
.btn-outline:hover{border-color:var(--accent)}

/* SUCCESS SCREEN */
.success-wrap{text-align:center; padding:20px 0}
.success-icon{
  width:76px; height:76px; border-radius:50%; background:var(--ok-soft);
  display:flex; align-items:center; justify-content:center;
  margin:0 auto 20px; font-size:2rem; color:var(--ok);
  animation:popIn .5s cubic-bezier(.34,1.56,.64,1);
}
@keyframes popIn{from{transform:scale(0); opacity:0} to{transform:scale(1); opacity:1}}
.success-title{font-family:'Fraunces',serif; font-size:1.5rem; font-weight:600; margin-bottom:8px}
.success-sub{font-size:.88rem; color:var(--muted); margin-bottom:24px; line-height:1.5}

/* RECIBO DE CONFIRMAÇÃO */
.recibo{
  background:var(--paper); border:1.5px dashed var(--line2);
  border-radius:var(--rs); padding:20px; text-align:left; margin-bottom:18px;
  position:relative;
}
.recibo-codigo{
  text-align:center; font-family:'Fraunces',serif; font-size:.68rem;
  letter-spacing:.12em; text-transform:uppercase; color:var(--accent);
  padding-bottom:14px; margin-bottom:14px;
  border-bottom:1.5px dashed var(--line2);
}
.recibo-codigo strong{display:block; font-size:1rem; letter-spacing:.06em; color:var(--accent-deep); margin-top:2px}
.recibo-row{display:flex; justify-content:space-between; align-items:baseline; font-size:.84rem; padding:7px 0}
.recibo-label{color:var(--muted); font-size:.72rem; text-transform:uppercase; letter-spacing:.02em}
.recibo-val{font-weight:700; text-align:right}
.recibo-perfuracao{
  height:1px; margin:12px 0;
  background-image:repeating-linear-gradient(90deg, var(--line2) 0 6px, transparent 6px 12px);
}
.recibo-total{display:flex; justify-content:space-between; align-items:baseline; padding-top:6px}
.recibo-total .recibo-label{font-size:.78rem}
.recibo-total .recibo-val{font-family:'Fraunces',serif; font-size:1.3rem; color:var(--accent-deep)}

/* SKELETON LOADING */
.skel{background:linear-gradient(90deg, var(--line) 25%, var(--line2) 37%, var(--line) 63%); background-size:400% 100%; animation:skelShine 1.4s ease infinite; border-radius:8px}
@keyframes skelShine{0%{background-position:100% 50%} 100%{background-position:0 50%}}
.skel-row{display:flex; align-items:center; gap:14px; padding:16px; border:1.5px solid var(--line); border-radius:var(--rs); margin-bottom:10px}
.skel-circle{width:38px; height:38px; border-radius:50%; flex-shrink:0}
.skel-lines{flex:1; display:flex; flex-direction:column; gap:6px}
.skel-line{height:11px; border-radius:5px}

.err-box{
  background:var(--er-soft); color:var(--er); border-radius:var(--rs);
  padding:12px 14px; font-size:.82rem; font-weight:600; margin-bottom:14px;
  display:none;
}

/* WHATSAPP FLUTUANTE */
.wa-fab{
  position:fixed; right:20px; bottom:20px; z-index:40;
  width:52px; height:52px; border-radius:50%; background:#25D366;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 4px 14px rgba(37,211,102,.45); text-decoration:none;
  transition:transform .15s;
}
.wa-fab:hover{transform:scale(1.06)}
.wa-fab svg{width:26px; height:26px}

footer{text-align:center; padding:24px 0 0; font-size:.72rem; color:var(--muted)}
footer a{color:var(--accent); text-decoration:none; font-weight:600}

@media(max-width:380px){
  .pro-grid{grid-template-columns:1fr}
  .time-grid{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="salon-name" id="salon-name">Carregando...</div>
    <div class="salon-underline"></div>
    <div class="salon-sub" id="salon-sub">&nbsp;</div>
    <div class="salon-meta" id="salon-meta"></div>
  </header>

  <div class="galeria-scroll" id="galeria-fotos" style="display:none"></div>

  <div class="steps-ind" id="steps-ind">
    <div class="step-dot on" data-s="1"></div>
    <div class="step-dot" data-s="2"></div>
    <div class="step-dot" data-s="3"></div>
    <div class="step-dot" data-s="4"></div>
  </div>

  <div class="card">
    <div id="card-content">
      <div class="card-bd" style="padding-top:20px">
        <div class="skel-row"><div class="skel skel-circle"></div><div class="skel-lines"><div class="skel skel-line" style="width:60%"></div><div class="skel skel-line" style="width:40%"></div></div></div>
        <div class="skel-row"><div class="skel skel-circle"></div><div class="skel-lines"><div class="skel skel-line" style="width:55%"></div><div class="skel skel-line" style="width:35%"></div></div></div>
        <div class="skel-row"><div class="skel skel-circle"></div><div class="skel-lines"><div class="skel skel-line" style="width:65%"></div><div class="skel skel-line" style="width:30%"></div></div></div>
      </div>
    </div>
  </div>

  <footer>Agendamento via <a href="https://belezaprooficial.com.br" target="_blank">Beleza Pro</a><div style="font-size:.6rem;opacity:.55;margin-top:4px">v4.6.0-agendar</div></footer>
</div>

<a id="wa-fab" class="wa-fab" style="display:none" target="_blank" title="Falar no WhatsApp">
  <svg viewBox="0 0 24 24" fill="#fff"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.72.45 3.4 1.31 4.88L2 22l5.34-1.4a9.9 9.9 0 0 0 4.7 1.2h.01c5.46 0 9.9-4.45 9.9-9.9C21.96 6.45 17.5 2 12.04 2zm5.8 14.02c-.24.68-1.4 1.3-1.94 1.38-.5.08-1.12.11-1.8-.11-.42-.13-.95-.31-1.64-.6-2.88-1.24-4.76-4.14-4.9-4.33-.14-.19-1.17-1.56-1.17-2.98s.74-2.12 1-2.41c.26-.29.57-.36.76-.36h.55c.18 0 .42-.07.65.5.24.58.82 2 .89 2.14.07.15.11.32.02.51-.09.19-.14.31-.27.48-.14.17-.29.38-.41.51-.14.15-.28.31-.12.61.16.29.71 1.17 1.52 1.9 1.05.94 1.93 1.23 2.22 1.37.3.15.47.13.64-.08.18-.2.75-.87.95-1.17.2-.29.39-.24.65-.15.27.1 1.7.8 1.99.95.29.15.48.22.55.34.07.13.07.72-.17 1.4z"/></svg>
</a>

<script>
var API = 'https://salaodebeleza-production-8eaa.up.railway.app';
var SALAO_ID = new URLSearchParams(window.location.search).get('salao') || '';
var STATE = { servico:null, profissional:null, data:null, hora:null, servicos:[], profissionais:[] };

// Ícone por categoria de serviço — só visual, não muda a lógica de nada
var ICONES_CATEGORIA = { 'Cabelo':'✂️', 'Barba':'🪒', 'Unhas':'💅', 'Estética':'✨', 'Sobrancelha':'✨' };
function iconeServico(categoria) { return ICONES_CATEGORIA[categoria] || '✂️'; }

// Troca o conteúdo do card com uma transição suave (sai deslizando, entra
// deslizando) em vez de trocar seco — é o "passo a passo" ficando com
// sensação de app de verdade, não de formulário empilhado
function trocarConteudo(novoHtml) {
  var el = document.getElementById('card-content');
  el.classList.add('leaving');
  setTimeout(function(){
    el.innerHTML = novoHtml;
    el.classList.remove('leaving');
    // Reinicia a animação de entrada
    el.style.animation = 'none';
    void el.offsetWidth; // força o navegador a recalcular antes de reaplicar
    el.style.animation = '';
  }, 180);
}

// Mostra um esqueleto de carregamento IMEDIATAMENTE (sem a animação de
// transição) — diferente de trocarConteudo(), que tem um pequeno atraso
// pra sair suave. Usar o atraso aqui causaria uma corrida: se a API
// responder rápido, o conteúdo real apareceria e DEPOIS o esqueleto
// atrasado sobrescreveria tudo de volta, travando a tela pra sempre.
function mostrarSkeleton(html) {
  document.getElementById('card-content').innerHTML = html;
}

function skeletonServicos() {
  var linhas = '';
  for (var i=0;i<4;i++) {
    linhas += '<div class="skel-row"><div class="skel skel-circle"></div><div class="skel-lines"><div class="skel skel-line" style="width:'+(50+i*5)+'%"></div><div class="skel skel-line" style="width:'+(30+i*3)+'%"></div></div></div>';
  }
  return '<div class="card-bd" style="padding-top:20px">' + linhas + '</div>';
}

function setStep(n) {
  document.querySelectorAll('.step-dot').forEach(function(d){
    var s = parseInt(d.dataset.s);
    d.classList.remove('on','done');
    if (s === n) d.classList.add('on');
    else if (s < n) d.classList.add('done');
  });
}

function init() {
  if (!SALAO_ID) {
    showError('Link inválido. Peça um novo link ao salão.');
    return;
  }
  fetch(API + '/api/publico/salao/' + SALAO_ID)
    .then(function(r){ return r.ok ? r.json() : Promise.reject(); })
    .then(function(salao){
      // O link pode ter vindo com o nome legível do salão (slug) em vez do
      // ID de verdade — a partir daqui já troca pro ID real, porque as
      // outras rotas (serviços, profissionais, horários) só entendem o ID.
      SALAO_ID = salao.id;

      document.getElementById('salon-name').textContent = salao.nome;
      document.getElementById('salon-sub').textContent = 'Agende seu horário em poucos cliques';

      // Endereço/cidade, com link pro Google Maps — e horário de funcionamento,
      // se o salão tiver preenchido cada um desses (ambos opcionais)
      var metaEl = document.getElementById('salon-meta');
      var partesMeta = [];
      if (salao.endereco || salao.cidade) {
        var local = [salao.endereco, salao.cidade].filter(Boolean).join(', ');
        var linkMaps = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(local);
        partesMeta.push('<a href="' + linkMaps + '" target="_blank">📍 ' + local + '</a>');
      }
      var horarioAbre = salao.configuracoes && salao.configuracoes.horario_abre;
      var horarioFecha = salao.configuracoes && salao.configuracoes.horario_fecha;
      if (horarioAbre && horarioFecha) {
        partesMeta.push('<span>🕒 ' + horarioAbre + ' às ' + horarioFecha + '</span>');
      }
      metaEl.innerHTML = partesMeta.join('');

      // Galeria de fotos do salão — só aparece se tiver alguma cadastrada
      if (salao.fotos && salao.fotos.length) {
        var galeria = document.getElementById('galeria-fotos');
        galeria.innerHTML = salao.fotos.map(function(f){
          return '<img class="galeria-foto" src="' + f.url + '" alt="' + (salao.nome||'') + '" loading="lazy"/>';
        }).join('');
        galeria.style.display = 'flex';
      }

      // Botão flutuante de WhatsApp, só aparece se o salão tiver telefone cadastrado
      if (salao.telefone) {
        var numeroLimpo = String(salao.telefone).replace(/\D/g,'');
        if (numeroLimpo.length >= 10) {
          if (!numeroLimpo.startsWith('55')) numeroLimpo = '55' + numeroLimpo;
          var fab = document.getElementById('wa-fab');
          fab.href = 'https://wa.me/' + numeroLimpo + '?text=' + encodeURIComponent('Olá! Vim pelo link de agendamento e tenho uma dúvida.');
          fab.style.display = 'flex';
        }
      }

      loadServicos();
    })
    .catch(function(){ showError('Não foi possível carregar este salão.'); });
}

function showError(msg) {
  document.getElementById('card-content').innerHTML =
    '<div class="card-bd"><div class="err-box" style="display:block">' + msg + '</div></div>';
}

function loadServicos() {
  setStep(1);
  mostrarSkeleton(skeletonServicos());
  fetch(API + '/api/publico/servicos/' + SALAO_ID)
    .then(function(r){ return r.json(); })
    .then(function(list){
      STATE.servicos = list;
      renderServicos(list);
    })
    .catch(function(){ showError('Erro ao carregar serviços.'); });
}

function renderServicos(list) {
  var html = '<div class="card-hd"><div class="eyebrow">Passo 1 de 4</div><div class="card-title">Qual serviço deseja?</div></div><div class="card-bd">';
  if (!list.length) {
    html += '<div class="no-slots">Nenhum serviço disponível no momento.</div>';
  } else {
    list.forEach(function(s){
      html += '<div class="svc-item" onclick="selectServico(\'' + s.id + '\')">' +
        '<div class="svc-icon">' + iconeServico(s.categoria) + '</div>' +
        '<div class="svc-info"><div class="svc-name">' + s.nome + '</div>' +
        '<div class="svc-meta">' + (s.categoria||'') + ' · ' + s.duracao_min + ' min</div></div>' +
        '<div class="svc-price">R$ ' + Number(s.preco).toFixed(2).replace('.',',') + '</div></div>';
    });
  }
  html += '</div>';
  document.getElementById('card-content').innerHTML = html;
}

function selectServico(id) {
  STATE.servico = STATE.servicos.find(function(s){ return s.id === id; });
  loadProfissionais();
}

function skeletonProfissionais() {
  return '<div class="card-bd" style="padding-top:20px"><div class="pro-grid">' +
    '<div class="skel" style="height:118px;border-radius:12px"></div>' +
    '<div class="skel" style="height:118px;border-radius:12px"></div>' +
    '</div></div>';
}

function loadProfissionais() {
  setStep(2);
  mostrarSkeleton(skeletonProfissionais());
  fetch(API + '/api/publico/profissionais/' + SALAO_ID)
    .then(function(r){ return r.json(); })
    .then(function(list){
      STATE.profissionais = list;
      renderProfissionais(list);
    })
    .catch(function(){ showError('Erro ao carregar profissionais.'); });
}

function renderProfissionais(list) {
  var html = '<div class="card-hd"><div class="eyebrow">Passo 2 de 4</div><div class="card-title">Com quem você quer ser atendido?</div></div><div class="card-bd">';
  if (!list.length) {
    html += '<div class="no-slots">Nenhum profissional disponível.</div>';
  } else {
    html += '<div class="pro-grid">';
    list.forEach(function(p){
      var cor = p.cor_agenda || '#9A5B3F';
      // Foto de verdade se o profissional tiver, senão continua a
      // bolinha colorida com a inicial (comportamento de antes preservado)
      var avatar = p.foto_url
        ? '<img class="pro-av" src="' + p.foto_url + '" alt="' + p.nome + '" style="object-fit:cover"/>'
        : '<div class="pro-av" style="background:'+cor+'">' + p.nome[0].toUpperCase() + '</div>';
      html += '<div class="pro-item" onclick="selectProfissional(\''+p.id+'\')">' +
        avatar +
        '<div class="pro-name">' + p.nome + '</div>' +
        '<div class="pro-esp">' + (p.especialidade||'') + '</div></div>';
    });
    html += '</div>';
  }
  html += '<button class="btn btn-ghost" onclick="loadServicos()">← Voltar</button></div>';
  document.getElementById('card-content').innerHTML = html;
}

function selectProfissional(id) {
  STATE.profissional = STATE.profissionais.find(function(p){ return p.id === id; });
  loadCalendario();
}

function loadCalendario() {
  setStep(3);
  var html = '<div class="card-hd"><div class="eyebrow">Passo 3 de 4</div><div class="card-title">Escolha o dia e horário</div></div><div class="card-bd">';
  html += '<div class="date-scroll" id="date-scroll"></div>';
  html += '<div id="time-area"><div class="no-slots">Selecione uma data acima</div></div>';
  html += '<button class="btn btn-ghost" onclick="loadProfissionais()">← Voltar</button></div>';
  trocarConteudo(html);

  setTimeout(function(){
    // Gera próximos 14 dias
    var dowNames = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
    var monNames = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
    var scroll = document.getElementById('date-scroll');
    if (!scroll) return;
    var html2 = '';
    for (var i = 0; i < 14; i++) {
      var d = new Date();
      d.setDate(d.getDate() + i);
      var iso = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
      html2 += '<div class="date-pill" data-date="'+iso+'" onclick="selectData(\''+iso+'\', this)">' +
        '<div class="date-dow">' + dowNames[d.getDay()] + '</div>' +
        '<div class="date-day">' + d.getDate() + '</div>' +
        '<div class="date-mon">' + monNames[d.getMonth()] + '</div></div>';
    }
    scroll.innerHTML = html2;
  }, 190);
}

function selectData(iso, el) {
  STATE.data = iso;
  STATE.hora = null;
  document.querySelectorAll('.date-pill').forEach(function(p){ p.classList.remove('sel'); });
  if (el) el.classList.add('sel');

  var timeArea = document.getElementById('time-area');
  timeArea.innerHTML = '<div class="time-grid">' +
    '<div class="skel" style="height:44px"></div><div class="skel" style="height:44px"></div><div class="skel" style="height:44px"></div><div class="skel" style="height:44px"></div>' +
    '<div class="skel" style="height:44px"></div><div class="skel" style="height:44px"></div><div class="skel" style="height:44px"></div><div class="skel" style="height:44px"></div>' +
    '</div>';
  buscarHorarios(iso, 0);
}

function buscarHorarios(iso, tentativa) {
  var timeArea = document.getElementById('time-area');
  var MAX_TENTATIVAS = 14; // procura até 14 dias adiante

  var url = API + '/api/publico/horarios/' + SALAO_ID +
    '?profissional_id=' + STATE.profissional.id +
    '&data=' + iso +
    '&duracao_min=' + STATE.servico.duracao_min;

  fetch(url).then(function(r){ return r.json(); })
    .then(function(res){
      var horarios = res.horarios || [];

      if (!horarios.length) {
        if (tentativa < MAX_TENTATIVAS) {
          // Tenta o próximo dia automaticamente
          var d = new Date(iso + 'T12:00:00');
          d.setDate(d.getDate() + 1);
          var proximoIso = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
          buscarHorarios(proximoIso, tentativa + 1);
          return;
        }
        timeArea.innerHTML = '<div class="no-slots">Nenhum horário disponível nos próximos 14 dias. Tente outro profissional.</div>';
        return;
      }

      // Se mudou de data (pulou pra outro dia), atualiza seleção visual e estado
      if (iso !== STATE.data) {
        STATE.data = iso;
        document.querySelectorAll('.date-pill').forEach(function(p){
          p.classList.toggle('sel', p.dataset.date === iso);
        });
        // Garante que a data está visível no scroll (caso tenha pulado pra fora dos 14 dias iniciais)
        var pillExistente = document.querySelector('.date-pill[data-date="'+iso+'"]');
        if (pillExistente) pillExistente.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
      }

      var avisoPulo = tentativa > 0
        ? '<div style="background:var(--accent-soft);color:var(--accent-deep);border-radius:var(--rs);padding:10px 12px;font-size:.78rem;font-weight:600;margin-bottom:12px">📅 Sem horários na data escolhida. Mostrando ' + formatData(iso) + '.</div>'
        : '';

      var html = avisoPulo + '<div class="time-grid">';
      horarios.forEach(function(h){
        html += '<div class="time-slot" onclick="selectHora(\''+h+'\', this)">' + h + '</div>';
      });
      html += '</div><button class="btn btn-primary" style="margin-top:16px" onclick="goToForm()" id="btn-continuar" disabled>Continuar</button>';
      timeArea.innerHTML = html;
    })
    .catch(function(){ timeArea.innerHTML = '<div class="no-slots">Erro ao buscar horários.</div>'; });
}

function selectHora(h, el) {
  STATE.hora = h;
  document.querySelectorAll('.time-slot').forEach(function(s){ s.classList.remove('sel'); });
  el.classList.add('sel');
  var btn = document.getElementById('btn-continuar');
  if (btn) btn.disabled = false;
}

function goToForm() {
  setStep(4);
  var html = '<div class="card-hd"><div class="eyebrow">Passo 4 de 4</div><div class="card-title">Seus dados</div></div><div class="card-bd">';

  html += '<div class="summary">';
  html += '<div class="sum-row"><span class="sum-label">Serviço</span><span class="sum-val">' + STATE.servico.nome + '</span></div>';
  html += '<div class="sum-row"><span class="sum-label">Profissional</span><span class="sum-val">' + STATE.profissional.nome + '</span></div>';
  html += '<div class="sum-row"><span class="sum-label">Data e hora</span><span class="sum-val">' + formatData(STATE.data) + ' às ' + STATE.hora + '</span></div>';
  html += '<div class="sum-row"><span class="sum-label">Total</span><span class="sum-total">R$ ' + Number(STATE.servico.preco).toFixed(2).replace('.',',') + '</span></div>';
  html += '</div>';

  html += '<div class="err-box" id="form-err"></div>';
  html += '<div class="fld"><label>Seu nome completo</label><input type="text" id="cli-nome" placeholder="Nome completo"/></div>';
  html += '<div class="fld"><label>WhatsApp / Telefone</label><input type="tel" id="cli-tel" placeholder="(11) 99999-9999"/></div>';
  html += '<button class="btn btn-primary" id="btn-confirmar" onclick="confirmarAgendamento()">Confirmar agendamento</button>';
  html += '<button class="btn btn-ghost" onclick="loadCalendario()">← Voltar</button>';
  html += '</div>';

  trocarConteudo(html);
}

function formatData(iso) {
  var d = new Date(iso + 'T12:00:00');
  var dowNames = ['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
  var monNames = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  return dowNames[d.getDay()] + ', ' + d.getDate() + ' de ' + monNames[d.getMonth()];
}

function confirmarAgendamento() {
  var nome = document.getElementById('cli-nome').value.trim();
  var tel  = document.getElementById('cli-tel').value.trim();
  var err  = document.getElementById('form-err');
  err.style.display = 'none';

  if (!nome) { err.textContent = 'Informe seu nome completo.'; err.style.display='block'; return; }
  if (!tel || tel.length < 8) { err.textContent = 'Informe um telefone válido.'; err.style.display='block'; return; }

  var btn = document.getElementById('btn-confirmar');
  btn.disabled = true; btn.textContent = 'Confirmando...';

  fetch(API + '/api/publico/agendar/' + SALAO_ID, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      nome: nome, telefone: tel,
      servico_id: STATE.servico.id,
      profissional_id: STATE.profissional.id,
      data: STATE.data, hora_inicio: STATE.hora
    })
  })
  .then(function(r){ return r.json().then(function(d){ if(!r.ok) throw new Error(d.error||'Erro ao agendar'); return d; }); })
  .then(function(res){ showSuccess(res); })
  .catch(function(e){
    err.textContent = e.message;
    err.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Confirmar agendamento';
  });
}

// Gera um arquivo .ics simples pra pessoa adicionar no calendário do
// celular direto — funciona no iOS e Android sem precisar de nenhuma lib
function gerarLinkCalendario() {
  var partes = STATE.data.split('-');
  var horaPartes = STATE.hora.split(':');
  var inicio = new Date(parseInt(partes[0]), parseInt(partes[1])-1, parseInt(partes[2]), parseInt(horaPartes[0]), parseInt(horaPartes[1]));
  var fim = new Date(inicio.getTime() + (STATE.servico.duracao_min || 60) * 60000);
  function fmtICS(d) {
    return d.getUTCFullYear() + String(d.getUTCMonth()+1).padStart(2,'0') + String(d.getUTCDate()).padStart(2,'0') + 'T' +
      String(d.getUTCHours()).padStart(2,'0') + String(d.getUTCMinutes()).padStart(2,'0') + '00Z';
  }
  var ics = ['BEGIN:VCALENDAR','VERSION:2.0','BEGIN:VEVENT',
    'SUMMARY:' + STATE.servico.nome + ' — ' + document.getElementById('salon-name').textContent,
    'DESCRIPTION:Atendimento com ' + STATE.profissional.nome,
    'DTSTART:' + fmtICS(inicio), 'DTEND:' + fmtICS(fim),
    'END:VEVENT','END:VCALENDAR'].join('\r\n');
  var blob = new Blob([ics], {type:'text/calendar'});
  return URL.createObjectURL(blob);
}

// Gera um código curto e legível a partir do ID do agendamento — só
// visual, pra dar aquela sensação de "número do pedido" de recibo de
// verdade (não é um código de verificação real, é decorativo)
function gerarCodigoConfirmacao(agendamentoId) {
  if (!agendamentoId) return '——————';
  return agendamentoId.replace(/-/g, '').slice(0, 8).toUpperCase();
}

function showSuccess(res) {
  STATE.agendamentoId = res.agendamento && res.agendamento.id;
  document.getElementById('steps-ind').style.display = 'none';
  var html = '<div class="card-bd"><div class="success-wrap">';
  html += '<div class="success-icon">✓</div>';
  html += '<div class="success-title">Agendamento confirmado!</div>';
  html += '<div class="success-sub">Te esperamos em ' + formatData(STATE.data) + ' às ' + STATE.hora + ' para o seu ' + STATE.servico.nome.toLowerCase() + '.</div>';

  html += '<div class="recibo">';
  html += '<div class="recibo-codigo">Código do agendamento<strong>' + gerarCodigoConfirmacao(STATE.agendamentoId) + '</strong></div>';
  html += '<div class="recibo-row"><span class="recibo-label">Serviço</span><span class="recibo-val">' + STATE.servico.nome + '</span></div>';
  html += '<div class="recibo-row"><span class="recibo-label">Profissional</span><span class="recibo-val">' + STATE.profissional.nome + '</span></div>';
  html += '<div class="recibo-row"><span class="recibo-label">Data</span><span class="recibo-val">' + formatData(STATE.data) + '</span></div>';
  html += '<div class="recibo-row"><span class="recibo-label">Horário</span><span class="recibo-val">' + STATE.hora + '</span></div>';
  html += '<div class="recibo-perfuracao"></div>';
  html += '<div class="recibo-total"><span class="recibo-label">Total</span><span class="recibo-val">R$ ' + Number(STATE.servico.preco).toFixed(2).replace('.',',') + '</span></div>';
  html += '</div>';

  html += '<a class="btn btn-outline" download="agendamento.ics" id="link-calendario" style="display:block;text-decoration:none;box-sizing:border-box">📅 Adicionar ao calendário</a>';
  html += '<button class="btn btn-primary" style="margin-top:10px" onclick="location.reload()">Fazer novo agendamento</button>';
  if (STATE.agendamentoId) {
    html += '<button class="btn btn-ghost" onclick="abrirCancelamento()">Cancelar este agendamento</button>';
  }
  html += '<div id="cancel-area"></div>';
  html += '</div></div>';
  trocarConteudo(html);
  setTimeout(function(){
    var linkCal = document.getElementById('link-calendario');
    if (linkCal) linkCal.href = gerarLinkCalendario();
  }, 200);
}

function abrirCancelamento() {
  var area = document.getElementById('cancel-area');
  area.innerHTML =
    '<div class="fld" style="margin-top:16px;text-align:left">' +
    '<label>Confirme seu telefone para cancelar</label>' +
    '<input type="tel" id="cancel-tel" placeholder="(11) 99999-9999"/>' +
    '</div>' +
    '<div class="err-box" id="cancel-err"></div>' +
    '<button class="btn" style="width:100%;background:var(--er);color:#fff" onclick="confirmarCancelamento()">Confirmar cancelamento</button>';
}

function confirmarCancelamento() {
  var tel = document.getElementById('cancel-tel').value.trim();
  var err = document.getElementById('cancel-err');
  err.style.display = 'none';
  if (!tel || tel.replace(/\D/g,'').length < 8) {
    err.textContent = 'Informe o telefone usado no agendamento.';
    err.style.display = 'block';
    return;
  }
  fetch(API + '/api/publico/cancelar/' + STATE.agendamentoId, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ telefone: tel })
  })
  .then(function(r){ return r.json().then(function(d){ if(!r.ok) throw new Error(d.error||'Erro ao cancelar'); return d; }); })
  .then(function(){
    document.getElementById('card-content').innerHTML =
      '<div class="card-bd"><div class="success-wrap">' +
      '<div class="success-icon" style="background:var(--er-soft);color:var(--er)">✕</div>' +
      '<div class="success-title">Agendamento cancelado</div>' +
      '<div class="success-sub">Seu horário foi liberado. Pode agendar novamente quando quiser.</div>' +
      '<button class="btn btn-primary" onclick="location.reload()">Fazer novo agendamento</button>' +
      '</div></div>';
  })
  .catch(function(e){
    err.textContent = e.message;
    err.style.display = 'block';
  });
}

init();
</script>
</body>
</html>
